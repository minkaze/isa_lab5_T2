<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title></title>

    <link rel="stylesheet" href="style.css">

    <script src="messages.js" defer></script>
    <script src="PatientAPI.js" defer></script>
    <script src="PatientUI.js" defer></script>
    <script src="client.js" defer></script>
</head>

<body>
    <main>
        <h1 id="pageTitle"></h1>

        <section>
            <button id="insertButton" type="button"></button>
        </section>

        <section>
            <label for="sqlQuery" id="queryLabel"></label>

            <textarea id="sqlQuery" rows="5"></textarea>

            <button id="submitButton" type="button"></button>
        </section>

        <section>
            <h2 id="responseTitle"></h2>
            <div id="responseOutput" role="status" aria-live="polite"></div>
        </section>

    </main>
</body>

</html>
